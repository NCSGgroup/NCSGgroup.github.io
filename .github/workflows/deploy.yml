name: Deploy Hexo with JupyterLite

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Hexo and JupyterLite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JupyterLite
        run: |
          python -m pip install -U pip
          pip install jupyterlite-core jupyterlite-pyodide-kernel jupyterlab

      - name: Build JupyterLite
        run: |
          rm -rf source/jupyterlite
          jupyter lite build --contents demos --output-dir source/jupyterlite

      - name: Build Hexo
        run: |
          npx hexo clean
          npx hexo generate

      - name: Show build size
        run: |
          echo "Size of public:"
          du -sh public || true
          echo "Size of public/jupyterlite:"
          du -sh public/jupyterlite || true
          echo "Largest files:"
          find public -type f -exec du -h {} + | sort -h | tail -30 || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
